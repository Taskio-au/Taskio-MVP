name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      REACT_APP_API_BASE_URL: https://api.taskio.com.au
      REACT_APP_FIREBASE_EXPECTED_PROJECT_ID: taskio-v2
      REACT_APP_E2E_AUTH_BYPASS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check src/server.js
      - run: node --check src/app.js
      - run: npm test

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: node --check functions/index.js
      - run: npm --prefix functions run lint
      - run: npm run test:functions

  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production API image
        run: docker build -t taskio-api:ci .
      - name: Inspect image config
        run: |
          workingDir="$(docker image inspect taskio-api:ci --format '{{.Config.WorkingDir}}')"
          user="$(docker image inspect taskio-api:ci --format '{{.Config.User}}')"
          cmd="$(docker image inspect taskio-api:ci --format '{{json .Config.Cmd}}')"
          echo "workingDir=$workingDir user=$user cmd=$cmd"
          test "$workingDir" = "/app/backend"
          test "$user" = "node"
          test "$cmd" = '["node","src/server.js"]'
      - name: Confirm image layout without network or credentials
        run: |
          docker run --rm --network=none --read-only --entrypoint sh taskio-api:ci -c "test -f /app/backend/src/server.js && test -f /app/shared/auLocations.js && test -f /app/shared/feePlans.js && test ! -e /app/backend/.env && test ! -e /app/backend/serviceAccountKey.json && test ! -e /app/serviceAccountKey.json"
