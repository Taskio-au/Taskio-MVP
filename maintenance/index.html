<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f766e">
    <title>Taskio is preparing to launch</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0fdfa; color: #0f172a; }
      main { width: min(680px, calc(100% - 32px)); padding: 48px; border: 1px solid #99f6e4; border-radius: 24px; background: #fff; box-shadow: 0 24px 70px rgba(15, 118, 110, .12); }
      .wordmark { margin-bottom: 40px; color: #0f766e; font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; }
      h1 { margin: 0 0 16px; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.08; }
      p { margin: 0; max-width: 55ch; color: #475569; font-size: 1.1rem; line-height: 1.7; }
      a { color: #0f766e; font-weight: 700; }
      @media (max-width: 520px) { main { padding: 32px 24px; border-radius: 18px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark" aria-label="Taskio">Taskio</div>
      <h1>We’re preparing Taskio for launch.</h1>
      <p>
        Taskio is not accepting tasks yet. Please check back soon, or contact the Taskio team through an
        approved support channel if you need help.
      </p>
    </main>
  </body>
</html>
